name: Build APK

on:
  push:
  workflow_dispatch:

env:
  ARE_CHEIE: ${{ secrets.CHEIE_BASE64 != '' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descarca proiectul
        uses: actions/checkout@v4

      - name: Pregateste Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pregateste Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Pune cheia de semnatura
        if: env.ARE_CHEIE == 'true'
        env:
          CHEIE: ${{ secrets.CHEIE_BASE64 }}
          PAROLA: ${{ secrets.PAROLA_CHEIE }}
          ALIAS: ${{ secrets.ALIAS_CHEIE }}
        run: |
          echo "$CHEIE" | base64 -d > pergament.jks
          cat > cheie.properties <<EOF
          storeFile=pergament.jks
          storePassword=$PAROLA
          keyAlias=$ALIAS
          keyPassword=$PAROLA
          EOF
          echo "Cheia e pregatita."

      - name: Ruleaza testele si construieste APK-ul de incercare
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace

      - name: Construieste APK-ul si pachetul AAB de publicare
        if: env.ARE_CHEIE == 'true'
        run: gradle assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Sterge urmele cheii
        if: always()
        run: rm -f pergament.jks cheie.properties

      - name: Urca APK-ul de incercare
        uses: actions/upload-artifact@v4
        with:
          name: Pergament-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Urca pachetul AAB pentru Play Store
        if: env.ARE_CHEIE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Pergament-PENTRU-PLAY-STORE-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Urca APK-ul semnat (pentru instalare directa pe telefon)
        if: env.ARE_CHEIE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Pergament-APK-semnat
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn
